name: GitHub Profile Reminder

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run GitHub Profile Reminder
        run: python reminder.py

      - name: Create reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const { owner, repo } = context.repo;

            // Ensure the 'reminder' label exists before using it
            try {
              await github.rest.issues.getLabel({ owner, repo, name: "reminder" });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "reminder",
                color: "0075ca",
                description: "Scheduled reminder",
              });
            }

            await github.rest.issues.create({
              owner,
              repo,
              title: `🔔 GitHub Profile Reminder – ${today}`,
              body: [
                "Hey! It's time to check and contribute to your GitHub profile. 🚀",
                "",
                "Here are a few things you can do:",
                "- [ ] Review and merge open pull requests",
                "- [ ] Close or comment on open issues",
                "- [ ] Push new commits to keep your contribution graph active",
                "- [ ] Update your profile README with recent work",
                "- [ ] Star or fork interesting repositories",
                "- [ ] Review your pinned repositories and keep them up to date",
                "",
                "Happy coding! Every contribution counts. 💪",
              ].join('\n'),
              labels: ["reminder"],
            });
